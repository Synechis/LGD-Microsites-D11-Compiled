name: Test LocalGov Microsites localgovdrupal/localgov_microsites_base drupal-theme

on:
  push:
    branches:
      - '2.x'
      - '3.x'
  pull_request:
    branches:
      - '2.x'
      - '3.x'
  workflow_dispatch:

jobs:
  tests:
    uses: localgovdrupal/localgov_shared_workflows/.github/workflows/test-microsites.yml@1.x
    with:
      project: 'localgovdrupal/localgov_microsites_base'
      project_path: 'web/themes/contrib/localgov_microsites_base'
